name: CI
on:
  push:
    branches: [main]
  pull_request:

env:
  BUNDLE_BUILD__RBSECP256K1: --with-system-library

jobs:
  ruby:
    name: Ruby ${{ matrix.ruby }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.1", "3.2", "3.3", "3.4"]
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y libsecp256k1-dev
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: COVERAGE=1 bundle exec rspec
      - run: bundle exec rubocop
      - run: gem build uncle_block_given.gemspec

  rails:
    name: Rails ${{ matrix.rails }} / Ruby ${{ matrix.ruby }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rails: "7.0", ruby: "3.1" }
          - { rails: "7.1", ruby: "3.2" }
          - { rails: "7.2", ruby: "3.3" }
          - { rails: "8.0", ruby: "3.4" }
    env:
      BUNDLE_GEMFILE: gemfiles/rails_${{ matrix.rails }}.gemfile
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y libsecp256k1-dev
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: RAILS_COMPAT=1 bundle exec rspec
